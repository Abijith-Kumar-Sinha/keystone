[project]
name = "keystone"
version = "0.1.0"
description = "Keystone: a graph-native agent that finds the people your codebase can't lose (FalkorDB)."
requires-python = ">=3.11"
dependencies = [
  "falkordb>=1.0.10",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=1.2,<2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
